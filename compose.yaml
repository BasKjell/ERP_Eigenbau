name: erp-eigenbau

x-erpnext-image: &erpnext-image
  image: frappe/erpnext:v16.53.0
  restart: unless-stopped

x-erpnext-backend: &erpnext-backend
  <<: *erpnext-image
  volumes:
    - erpnext-sites-v16:/home/frappe/frappe-bench/sites
    - erpnext-logs-v16:/home/frappe/frappe-bench/logs
  depends_on:
    erpnext-configurator:
      condition: service_completed_successfully

x-redmine-image: &redmine-image
  image: erp-eigenbau-redmine:7.0.3-flow-sso
  build:
    context: .
    dockerfile: deployment/redmine/Dockerfile

services:
  demo-db:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEMO_DB_NAME:-platform_demo}
      POSTGRES_USER: ${DEMO_DB_USER:-platform}
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:-platform-demo-change-me}
    volumes:
      - demo-db-data:/var/lib/postgresql/data
      - ./deployment/postgres/init.sql:/docker-entrypoint-initdb.d/10-platform.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform]

  management-reporting-seed:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    profiles: [ops]
    restart: "no"
    entrypoint: ["sh", "/seed/apply_management_reporting.sh"]
    environment:
      PGHOST: demo-db
      PGPORT: 5432
      PGDATABASE: ${DEMO_DB_NAME:-platform_demo}
      PGUSER: ${DEMO_DB_USER:-platform}
      PGPASSWORD: ${DEMO_DB_PASSWORD:-platform-demo-change-me}
      GRAFANA_MANAGEMENT_DB_PASSWORD: ${GRAFANA_MANAGEMENT_DB_PASSWORD:-grafana-management-demo-change-me}
    volumes:
      - ./deployment/postgres/apply_management_reporting.sh:/seed/apply_management_reporting.sh:ro
      - ./deployment/postgres/management_reporting.sql:/seed/management_reporting.sql:ro
    depends_on:
      demo-db:
        condition: service_healthy
    networks: [platform]

  platform-api:
    build:
      context: ./services/platform_api
      target: base
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      DEMO_DATA_FILE: /data/scenario.json
      DEMO_SEED_FILE: /app/seed/scenario.json
      DOCUMENT_DIR: /app/documents
      AI_MODE: ${AI_MODE:-deterministic}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      ERPNEXT_BASE_URL: ${ERPNEXT_BASE_URL:-http://erpnext-frontend:8080}
      ERPNEXT_API_KEY: ${ERPNEXT_API_KEY:-}
      ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET:-}
      ERPNEXT_USERNAME: ${ERPNEXT_USERNAME:-Administrator}
      ERPNEXT_PASSWORD: ${ERPNEXT_ADMIN_PASSWORD:-admin-demo-change-me}
      PAPERLESS_BASE_URL: ${PAPERLESS_BASE_URL:-http://paperless-webserver:8000}
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN:-}
      REDMINE_BASE_URL: ${REDMINE_BASE_URL:-http://redmine:3000}
      REDMINE_PUBLIC_URL: ${REDMINE_PUBLIC_URL:-http://localhost:8011}
      OPEN_WEBUI_PUBLIC_URL: ${OPEN_WEBUI_PUBLIC_URL:-http://localhost:3001}
      PROMETHEUS_PUBLIC_URL: ${PROMETHEUS_PUBLIC_URL:-http://localhost:9090}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000}
      REDMINE_API_KEY: ${REDMINE_API_KEY:-f6ab4d1c02fe9a7b3e5d8c4f1a6b9e2c7d0f3a5b}
      READINESS_REQUIRE_INTEGRATIONS: ${READINESS_REQUIRE_INTEGRATIONS:-false}
      AUTH_MODE: ${AUTH_MODE:-demo}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-local-session-secret-change-before-network-use}
      AUTH_SESSION_MINUTES: ${AUTH_SESSION_MINUTES:-480}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      PLATFORM_DEMO_ADMIN_TOKEN: ${PLATFORM_DEMO_ADMIN_TOKEN:-local-demo-admin-token-change-before-network-use}
      DEMO_USER_SWITCH: ${DEMO_USER_SWITCH:-true}
      REPORTING_API_TOKEN: ${REPORTING_API_TOKEN:-local-reporting-token-change-before-network-use}
      PLATFORM_PUBLIC_URL: ${PLATFORM_PUBLIC_URL:-http://localhost:8088}
      OIDC_CLIENT_ID: platform-portal
      OIDC_EXTERNAL_ISSUER: ${OIDC_EXTERNAL_ISSUER:-http://localhost:8082/realms/open-manufacturing}
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/open-manufacturing
      # FLOWAGENTS: Register (read-only). Der Orchestrator läuft auf dem Host und meldet sich
      # selbst an (Pull-Modell); er braucht keinen von Containern erreichbaren Port.
      AGENT_REGISTRY_DIR: /app/agents
      FLOW_AGENTS_API_SECRET: ${FLOW_AGENTS_API_SECRET:-local-agents-api-secret-change-before-network-use}
      FLOW_AGENT_RM_SECRET: ${FLOW_AGENT_RM_SECRET:-local-agent-rm-secret-change-before-network-use}
      PAPERLESS_REMOTE_USER_HEADER: X-Flow-Sso-User
      # FLOWDOC-Dateispeicher für Formate, die Paperless nicht verarbeitet (STL), siehe app/dms_files.py
      DMS_FILE_STORE: /data/flowdoc-files
    ports:
      - "${DEMO_API_PORT:-8088}:8080"
    volumes:
      - demo-state:/data
      - flowdoc-files:/data/flowdoc-files
      - ./output/pdf:/app/documents:ro
      - ./agents:/app/agents:ro
      - ./requirements:/app/requirements:ro
    depends_on:
      demo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [platform]

  platform-mcp:
    build:
      context: ./services/platform_api
      target: base
    restart: unless-stopped
    command: ["python", "-m", "app.mcp_server"]
    environment:
      TZ: ${TZ:-Europe/Berlin}
      DEMO_DATA_FILE: /data/scenario.json
      DEMO_SEED_FILE: /app/seed/scenario.json
      DOCUMENT_DIR: /app/documents
      ERPNEXT_BASE_URL: ${ERPNEXT_BASE_URL:-http://erpnext-frontend:8080}
      ERPNEXT_PUBLIC_URL: ${ERPNEXT_PUBLIC_URL:-http://localhost:8081}
      ERPNEXT_API_KEY: ${ERPNEXT_API_KEY:-}
      ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET:-}
      ERPNEXT_USERNAME: ${ERPNEXT_USERNAME:-Administrator}
      ERPNEXT_PASSWORD: ${ERPNEXT_ADMIN_PASSWORD:-admin-demo-change-me}
      MCP_WRITE_ENABLED: ${MCP_WRITE_ENABLED:-true}
      MCP_MAX_WRITE_RECORDS: ${MCP_MAX_WRITE_RECORDS:-100}
      MCP_AUDIT_FILE: /data/mcp-write-audit.jsonl
      MCP_DEFAULT_COMPANY: ${MCP_DEFAULT_COMPANY:-Open Manufacturing Demo GmbH}
      PAPERLESS_BASE_URL: ${PAPERLESS_BASE_URL:-http://paperless-webserver:8000}
      PAPERLESS_PUBLIC_URL: ${PAPERLESS_PUBLIC_URL:-http://localhost:8010}
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN:-}
    ports:
      - "127.0.0.1:${MCP_PORT:-8090}:8090"
    volumes:
      - demo-state:/data
      - ./output/pdf:/app/documents:ro
    depends_on:
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8090), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [platform]

  dms-mcp:
    build:
      context: ./services/platform_api
      target: base
    profiles: [full]
    restart: unless-stopped
    command: ["python", "-m", "app.dms_mcp_server"]
    environment:
      TZ: ${TZ:-Europe/Berlin}
      PAPERLESS_BASE_URL: ${PAPERLESS_BASE_URL:-http://paperless-webserver:8000}
      PAPERLESS_PUBLIC_URL: ${PAPERLESS_PUBLIC_URL:-http://localhost:8010}
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN:-}
      PAPERLESS_USERNAME: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:-admin-demo-change-me}
      KNOWLEDGE_DATABASE_URL: postgresql://${DEMO_DB_USER:-platform}:${DEMO_DB_PASSWORD:-platform-demo-change-me}@demo-db:5432/${DEMO_DB_NAME:-platform_demo}
      DMS_EMBEDDING_DIMENSIONS: 768
      DMS_EMBEDDING_MODEL: flow-hash-de-768-v1
    ports:
      - "127.0.0.1:${DMS_MCP_PORT:-8091}:8091"
    depends_on:
      paperless-webserver:
        condition: service_healthy
      demo-db:
        condition: service_healthy
      dms-vector-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8091), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [platform]

  dms-vector-seed:
    build:
      context: ./services/platform_api
      target: base
    profiles: [full]
    restart: "no"
    command: ["python", "-m", "app.dms_vector_index", "--wait-seconds", "90", "--max-documents", "200"]
    environment:
      PAPERLESS_BASE_URL: ${PAPERLESS_BASE_URL:-http://paperless-webserver:8000}
      PAPERLESS_PUBLIC_URL: ${PAPERLESS_PUBLIC_URL:-http://localhost:8010}
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN:-}
      PAPERLESS_USERNAME: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:-admin-demo-change-me}
      KNOWLEDGE_DATABASE_URL: postgresql://${DEMO_DB_USER:-platform}:${DEMO_DB_PASSWORD:-platform-demo-change-me}@demo-db:5432/${DEMO_DB_NAME:-platform_demo}
      DMS_EMBEDDING_DIMENSIONS: 768
      DMS_EMBEDDING_MODEL: flow-hash-de-768-v1
    depends_on:
      demo-db:
        condition: service_healthy
      paperless-webserver:
        condition: service_healthy
      paperless-seed:
        condition: service_completed_successfully
      paperless-iam-seed:
        condition: service_completed_successfully
    networks: [platform]

  knowledge-mcp:
    build:
      context: ./services/platform_api
      target: base
    restart: unless-stopped
    command: ["python", "-m", "app.knowledge_mcp_server"]
    environment:
      DOCUMENTATION_DIR: /docs
      DOCUMENTATION_PUBLIC_URL: ${DOCUMENTATION_PUBLIC_URL:-http://localhost:8001}
    ports:
      - "127.0.0.1:${KNOWLEDGE_MCP_PORT:-8092}:8092"
    volumes:
      - ./docs:/docs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8092), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [platform]

  dev-mcp:
    # FLOWAI-Werkzeuge „Entwicklung & Repository“: Repository nur lesend (ausgewählte Bereiche,
    # keine .env), Agentenstatus und Fachauftrags-Vorschläge. Keine Schreibrechte am Code.
    build:
      context: ./services/platform_api
      target: base
    profiles: [full, webui]
    restart: unless-stopped
    command: ["python", "-m", "app.dev_mcp_server"]
    environment:
      REPOSITORY_DIR: /repo
      PLATFORM_INTERNAL_URL: http://platform-api:8080
      FLOW_DEV_MCP_TOKEN: ${FLOW_DEV_MCP_TOKEN:-local-dev-mcp-token-change-before-network-use}
    ports:
      - "127.0.0.1:${DEV_MCP_PORT:-8093}:8093"
    volumes:
      - ./agents:/repo/agents:ro
      - ./services:/repo/services:ro
      - ./docs:/repo/docs:ro
      - ./requirements:/repo/requirements:ro
      - ./scripts:/repo/scripts:ro
      - ./AGENTS.md:/repo/AGENTS.md:ro
      - ./README.md:/repo/README.md:ro
      - ./compose.yaml:/repo/compose.yaml:ro
      - ./Makefile:/repo/Makefile:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8093), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [platform]

  docs:
    image: squidfunk/mkdocs-material:9.8.0
    restart: unless-stopped
    command: serve --dev-addr=0.0.0.0:8000
    volumes:
      - .:/docs:ro
    networks: [platform]

  docs-shell:
    image: nginx:1.29.5-alpine
    restart: unless-stopped
    ports:
      - "${DOCS_PORT:-8001}:8080"
    volumes:
      - ./deployment/app-shell/docs.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/app-shell:/etc/nginx/company:ro
      - ./services/platform_api/app/static/company-shell.js:/opt/company-shell/company-shell.js:ro
      - ./services/platform_api/app/static/company-theme.css:/opt/company-shell/company-theme.css:ro
      - ./services/platform_api/app/static/app-launcher.js:/opt/company-shell/app-launcher.js:ro
      - ./services/platform_api/app/static/app-launcher.css:/opt/company-shell/app-launcher.css:ro
    depends_on:
      docs:
        condition: service_started
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/_company/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [platform]

  paperless-broker:
    image: redis:8.2.2-alpine
    profiles: [full]
    restart: unless-stopped
    volumes:
      - paperless-redis:/data
    networks: [platform]

  paperless-db:
    image: postgres:18.0-alpine
    profiles: [full]
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD:-paperless-demo-change-me}
    volumes:
      - paperless-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform]

  paperless-webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.4.0
    profiles: [full]
    restart: unless-stopped
    depends_on:
      paperless-db:
        condition: service_healthy
      paperless-broker:
        condition: service_started
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD:-paperless-demo-change-me}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-replace-with-a-long-random-value}
      PAPERLESS_TIME_ZONE: ${TZ:-Europe/Berlin}
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:-admin-demo-change-me}
      PAPERLESS_URL: http://localhost:${PAPERLESS_PORT:-8010}
      PAPERLESS_ENABLE_HTTP_REMOTE_USER: "true"
      # FLOWDOC-Oberfläche: Die Plattform-API fragt im internen Netz im Namen der FLOWID-Person.
      PAPERLESS_ENABLE_HTTP_REMOTE_USER_API: "true"
      PAPERLESS_HTTP_REMOTE_USER_HEADER_NAME: HTTP_X_FLOW_SSO_USER
      PAPERLESS_LOGOUT_REDIRECT_URL: http://localhost:${DEMO_API_PORT:-8088}/auth/logout
      PAPERLESS_DISABLE_REGULAR_LOGIN: "true"
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-export:/usr/src/paperless/export
      - paperless-consume:/usr/src/paperless/consume
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [platform]

  paperless-shell:
    image: nginx:1.29.5-alpine
    profiles: [full]
    restart: unless-stopped
    ports:
      - "${PAPERLESS_PORT:-8010}:8080"
    volumes:
      - ./deployment/app-shell/paperless.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/app-shell:/etc/nginx/company:ro
      - ./services/platform_api/app/static/company-shell.js:/opt/company-shell/company-shell.js:ro
      - ./services/platform_api/app/static/company-theme.css:/opt/company-shell/company-theme.css:ro
      - ./services/platform_api/app/static/app-launcher.js:/opt/company-shell/app-launcher.js:ro
      - ./services/platform_api/app/static/app-launcher.css:/opt/company-shell/app-launcher.css:ro
    depends_on:
      paperless-webserver:
        condition: service_healthy
      paperless-iam-seed:
        condition: service_completed_successfully
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/_company/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [platform]

  paperless-seed:
    image: alpine:3.22.2
    profiles: [full]
    restart: "no"
    command:
      - "sh"
      - "-c"
      - >
        if [ -f /state/sample-pdfs-v2.done ]; then
          echo 'Paperless demo PDFs already seeded';
        elif [ -f /state/sample-pdfs-v1.done ]; then
          cp -n /seed/Bewerbung_APP-0001_Lea-Muster.pdf /consume/ 2>/dev/null || true;
          cp -n /seed/Entgeltabrechnung_PAY-2026-10_DEMO-EMP-001.pdf /consume/ 2>/dev/null || true;
          touch /state/sample-pdfs-v2.done;
          echo 'Paperless HR demo PDFs queued once';
        else
          cp -n /seed/*.pdf /consume/ 2>/dev/null || true;
          touch /state/sample-pdfs-v1.done;
          touch /state/sample-pdfs-v2.done;
          echo 'Paperless demo PDFs queued once';
        fi
    volumes:
      - ./output/pdf:/seed:ro
      - paperless-consume:/consume
      - paperless-seed-state:/state
    depends_on:
      paperless-reporting-seed:
        condition: service_completed_successfully
    networks: [platform]

  paperless-governance-seed:
    build:
      context: ./services/platform_api
      target: base
    profiles: [full]
    restart: "no"
    entrypoint: ["python", "-m", "app.paperless_governance"]
    command: ["--config", "/config/governance.json"]
    environment:
      PAPERLESS_BASE_URL: http://paperless-webserver:8000
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:-admin-demo-change-me}
    volumes:
      - ./deployment/paperless/governance.json:/config/governance.json:ro
    depends_on:
      paperless-webserver:
        condition: service_healthy
    networks: [platform]

  paperless-iam-seed:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.4.0
    profiles: [full]
    restart: "no"
    entrypoint: ["python", "manage.py", "shell", "-c"]
    command: ["exec(open('/seed/sync_keycloak_users.py').read())"]
    working_dir: /usr/src/paperless/src
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD:-paperless-demo-change-me}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-replace-with-a-long-random-value}
    volumes:
      - ./deployment/paperless/sync_keycloak_users.py:/seed/sync_keycloak_users.py:ro
      - ./services/platform_api/app/iam_roles.py:/seed/iam_roles.py:ro
      - ./deployment/keycloak/realm.json:/seed/realm.json:ro
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
    depends_on:
      paperless-governance-seed:
        condition: service_completed_successfully
    networks: [platform]

  paperless-reporting-seed:
    image: postgres:18.0-alpine
    profiles: [full]
    restart: "no"
    entrypoint: ["sh", "/seed/apply_reporting.sh"]
    environment:
      PGHOST: paperless-db
      PGPORT: 5432
      PGDATABASE: paperless
      PGUSER: paperless
      PGPASSWORD: ${PAPERLESS_DB_PASSWORD:-paperless-demo-change-me}
      GRAFANA_PAPERLESS_DB_PASSWORD: ${GRAFANA_PAPERLESS_DB_PASSWORD:-grafana-paperless-demo-change-me}
    volumes:
      - ./deployment/paperless/apply_reporting.sh:/seed/apply_reporting.sh:ro
      - ./deployment/paperless/reporting.sql:/seed/reporting.sql:ro
    depends_on:
      paperless-governance-seed:
        condition: service_completed_successfully
    networks: [platform]

  erpnext-db:
    # ERPNext/Frappe v16's MariaDB client requires TLS during site bootstrap.
    # This is the same LTS line used by the upstream frappe_docker v16 demo.
    image: mariadb:11.8.9
    profiles: [full]
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD:-erpnext-demo-change-me}
      MARIADB_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD:-erpnext-demo-change-me}
    volumes:
      - erpnext-db-data-v16:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [platform]

  erpnext-redis-cache:
    image: redis:8.2.2-alpine
    profiles: [full]
    restart: unless-stopped
    networks: [platform]

  erpnext-redis-queue:
    image: redis:8.2.2-alpine
    profiles: [full]
    restart: unless-stopped
    volumes:
      - erpnext-redis-queue:/data
    networks: [platform]

  erpnext-configurator:
    <<: *erpnext-backend
    profiles: [full]
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host erpnext-db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache redis://erpnext-redis-cache:6379;
        bench set-config -g redis_queue redis://erpnext-redis-queue:6379;
        bench set-config -g redis_socketio redis://erpnext-redis-queue:6379;
        bench set-config -gp socketio_port 9000;
        bench set-config -g webserver_host erpnext-backend;
        bench set-config -gp webserver_port 8000;
    depends_on:
      erpnext-db:
        condition: service_healthy
      erpnext-redis-cache:
        condition: service_started
      erpnext-redis-queue:
        condition: service_started
    networks: [platform]

  erpnext-create-site:
    <<: *erpnext-backend
    profiles: [full]
    restart: "no"
    environment:
      ERPNEXT_PUBLIC_URL: ${ERPNEXT_PUBLIC_URL:-http://localhost:8081}
    entrypoint: ["bash", "-c"]
    command:
      - >
        if [ ! -d sites/frontend ]; then
          bench new-site frontend
          --mariadb-user-host-login-scope='%'
          --admin-password='${ERPNEXT_ADMIN_PASSWORD:-admin-demo-change-me}'
          --db-root-username=root
          --db-root-password='${ERPNEXT_DB_ROOT_PASSWORD:-erpnext-demo-change-me}'
          --install-app erpnext
          --set-default;
        else
          echo 'Site frontend exists';
        fi;
        bench --site frontend set-config host_name "$${ERPNEXT_PUBLIC_URL}";
        bench use frontend;
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    networks: [platform]

  erpnext-backend:
    <<: *erpnext-backend
    profiles: [full]
    depends_on:
      erpnext-create-site:
        condition: service_completed_successfully
    networks: [platform]

  erpnext-seed:
    <<: *erpnext-image
    profiles: [full]
    restart: "no"
    entrypoint: ["/home/frappe/frappe-bench/env/bin/python", "/seed/seed_demo.py"]
    environment:
      FRAPPE_SITE: frontend
      FRAPPE_BENCH_ROOT: /home/frappe/frappe-bench
      FRAPPE_SITES_PATH: /home/frappe/frappe-bench/sites
      ERP_DEMO_DATA_FILE: /seed/scenario.json
      ERPNEXT_OIDC_CLIENT_SECRET: ${ERPNEXT_OIDC_CLIENT_SECRET:-erpnext-oidc-demo-change-me}
      OIDC_EXTERNAL_ISSUER: ${OIDC_EXTERNAL_ISSUER:-http://localhost:8082/realms/open-manufacturing}
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/open-manufacturing
    volumes:
      - erpnext-sites-v16:/home/frappe/frappe-bench/sites
      - erpnext-logs-v16:/home/frappe/frappe-bench/logs
      - ./deployment/erpnext/seed_demo.py:/seed/seed_demo.py:ro
      - ./services/platform_api/seed/scenario.json:/seed/scenario.json:ro
    depends_on:
      erpnext-create-site:
        condition: service_completed_successfully
    networks: [platform]

  erpnext-frontend:
    <<: *erpnext-image
    profiles: [full]
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: erpnext-backend:8000
      SOCKETIO: erpnext-websocket:9000
      FRAPPE_SITE_NAME_HEADER: frontend
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - erpnext-sites-v16:/home/frappe/frappe-bench/sites
      - erpnext-logs-v16:/home/frappe/frappe-bench/logs
    depends_on:
      - erpnext-backend
      - erpnext-websocket
    networks:
      platform:
        aliases:
          # Frappe's stock realtime proxy uses this internal site hostname for
          # its authenticated callback to the web frontend.
          - frontend

  erpnext-shell:
    image: nginx:1.29.5-alpine
    profiles: [full]
    restart: unless-stopped
    ports:
      - "${ERPNEXT_PORT:-8081}:8080"
    volumes:
      - ./deployment/app-shell/erpnext.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/app-shell:/etc/nginx/company:ro
      - ./services/platform_api/app/static/company-shell.js:/opt/company-shell/company-shell.js:ro
      - ./services/platform_api/app/static/company-theme.css:/opt/company-shell/company-theme.css:ro
      - ./services/platform_api/app/static/app-launcher.js:/opt/company-shell/app-launcher.js:ro
      - ./services/platform_api/app/static/app-launcher.css:/opt/company-shell/app-launcher.css:ro
    depends_on:
      erpnext-frontend:
        condition: service_started
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/_company/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [platform]

  erpnext-websocket:
    <<: *erpnext-backend
    profiles: [full]
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    depends_on:
      erpnext-create-site:
        condition: service_completed_successfully
    networks: [platform]

  erpnext-queue-short:
    <<: *erpnext-backend
    profiles: [full]
    command: ["bench", "worker", "--queue", "short,default"]
    depends_on:
      erpnext-create-site:
        condition: service_completed_successfully
    networks: [platform]

  erpnext-queue-long:
    <<: *erpnext-backend
    profiles: [full]
    command: ["bench", "worker", "--queue", "long,default,short"]
    depends_on:
      erpnext-create-site:
        condition: service_completed_successfully
    networks: [platform]

  erpnext-scheduler:
    <<: *erpnext-backend
    profiles: [full]
    command: ["bench", "schedule"]
    depends_on:
      erpnext-create-site:
        condition: service_completed_successfully
    networks: [platform]

  redmine-db:
    image: postgres:18.0-alpine
    profiles: [full, work]
    restart: unless-stopped
    environment:
      POSTGRES_DB: redmine
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: ${REDMINE_DB_PASSWORD:-redmine-demo-change-me}
    volumes:
      - redmine-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine -d redmine"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [platform]

  redmine:
    <<: *redmine-image
    profiles: [full, work]
    restart: unless-stopped
    environment:
      REDMINE_DB_POSTGRES: redmine-db
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: ${REDMINE_DB_PASSWORD:-redmine-demo-change-me}
      REDMINE_SECRET_KEY_BASE: ${REDMINE_SECRET_KEY_BASE:-local-redmine-secret-change-before-network-use}
      FLOW_SSO_ENABLED: "true"
    volumes:
      - redmine-files:/usr/src/redmine/files
    depends_on:
      redmine-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/')).code.to_i < 500 ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [platform]

  redmine-shell:
    image: nginx:1.29.5-alpine
    profiles: [full, work]
    restart: unless-stopped
    ports:
      - "${REDMINE_PORT:-8011}:8080"
    volumes:
      - ./deployment/app-shell/redmine.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/app-shell:/etc/nginx/company:ro
      - ./services/platform_api/app/static/company-shell.js:/opt/company-shell/company-shell.js:ro
      - ./services/platform_api/app/static/company-theme.css:/opt/company-shell/company-theme.css:ro
      - ./services/platform_api/app/static/app-launcher.js:/opt/company-shell/app-launcher.js:ro
      - ./services/platform_api/app/static/app-launcher.css:/opt/company-shell/app-launcher.css:ro
    depends_on:
      redmine:
        condition: service_healthy
      redmine-seed:
        condition: service_completed_successfully
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/_company/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [platform]

  redmine-seed:
    <<: *redmine-image
    profiles: [full, work]
    restart: "no"
    command: ["bundle", "exec", "rails", "runner", "/seed/seed.rb"]
    environment:
      RAILS_ENV: production
      REDMINE_DB_POSTGRES: redmine-db
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: ${REDMINE_DB_PASSWORD:-redmine-demo-change-me}
      REDMINE_SECRET_KEY_BASE: ${REDMINE_SECRET_KEY_BASE:-local-redmine-secret-change-before-network-use}
      REDMINE_ADMIN_PASSWORD: ${REDMINE_ADMIN_PASSWORD:-admin-demo-change-me}
      REDMINE_API_KEY: ${REDMINE_API_KEY:-f6ab4d1c02fe9a7b3e5d8c4f1a6b9e2c7d0f3a5b}
    volumes:
      - redmine-files:/usr/src/redmine/files
      - ./deployment/redmine/seed.rb:/seed/seed.rb:ro
      - ./deployment/keycloak/realm.json:/seed/realm.json:ro
    depends_on:
      redmine:
        condition: service_healthy
    networks: [platform]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    profiles: [iam, full, webui, ai-gateway]
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-demo-change-me}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8082}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./deployment/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    networks: [platform]

  keycloak-shell:
    image: nginx:1.29.5-alpine
    profiles: [iam, full, webui, ai-gateway]
    restart: unless-stopped
    ports:
      - "${KEYCLOAK_PORT:-8082}:8080"
    volumes:
      - ./deployment/app-shell/keycloak.conf:/etc/nginx/conf.d/default.conf:ro
      - ./services/platform_api/app/static/company-shell.js:/opt/company-shell/company-shell.js:ro
      - ./services/platform_api/app/static/company-theme.css:/opt/company-shell/company-theme.css:ro
      - ./services/platform_api/app/static/app-launcher.js:/opt/company-shell/app-launcher.js:ro
      - ./services/platform_api/app/static/app-launcher.css:/opt/company-shell/app-launcher.css:ro
    depends_on:
      keycloak:
        condition: service_started
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/realms/open-manufacturing"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [platform]

  keycloak-sync:
    image: python:3.13-slim
    profiles: [iam, full, webui, ai-gateway]
    restart: "no"
    entrypoint: ["python", "/sync/sync_keycloak.py"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-demo-change-me}
      ERPNEXT_OIDC_CLIENT_SECRET: ${ERPNEXT_OIDC_CLIENT_SECRET:-erpnext-oidc-demo-change-me}
      AGENTGATEWAY_OIDC_CLIENT_SECRET: ${AGENTGATEWAY_OIDC_CLIENT_SECRET:-agentgateway-oidc-demo-change-me}
    volumes:
      - ./deployment/keycloak/sync_keycloak.py:/sync/sync_keycloak.py:ro
      - ./deployment/keycloak/realm.json:/sync/realm.json:ro
    depends_on:
      keycloak:
        condition: service_started
    networks: [platform]

  ollama:
    image: ollama/ollama:0.40.7
    profiles: [ai]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks: [platform]

  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.7.0
    profiles: [full, webui, ai-gateway]
    restart: unless-stopped
    command: ["-f", "/config/config.yaml"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AGENTGATEWAY_OLLAMA_BASE_URL: ${AGENTGATEWAY_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      AGENTGATEWAY_OPENWEBUI_KEY: ${AGENTGATEWAY_OPENWEBUI_KEY:-agw-demo-openwebui-change-before-network-use}
      # FLOWAGENTS: je Agentenrolle ein eigener virtueller Schlüssel (nur ihr Modellprofil).
      FLOW_AGENT_GATEWAY_KEY_ANFORDERUNGEN: ${FLOW_AGENT_GATEWAY_KEY_ANFORDERUNGEN:-agw-demo-anforderungen-change-before-network-use}
      FLOW_AGENT_GATEWAY_KEY_ANFORDERUNGSPRUEFUNG: ${FLOW_AGENT_GATEWAY_KEY_ANFORDERUNGSPRUEFUNG:-agw-demo-anforderungspruefung-change-before-network-use}
      FLOW_AGENT_GATEWAY_KEY_ARCHITEKTUR: ${FLOW_AGENT_GATEWAY_KEY_ARCHITEKTUR:-agw-demo-architektur-change-before-network-use}
      FLOW_AGENT_GATEWAY_KEY_SICHERHEIT: ${FLOW_AGENT_GATEWAY_KEY_SICHERHEIT:-agw-demo-sicherheit-change-before-network-use}
      FLOW_AGENT_GATEWAY_KEY_PLANUNG: ${FLOW_AGENT_GATEWAY_KEY_PLANUNG:-agw-demo-planung-change-before-network-use}
      FLOW_AGENT_GATEWAY_KEY_ENTWICKLUNG: ${FLOW_AGENT_GATEWAY_KEY_ENTWICKLUNG:-agw-demo-entwicklung-change-before-network-use}
      FLOW_AGENT_GATEWAY_KEY_AKZEPTANZTEST: ${FLOW_AGENT_GATEWAY_KEY_AKZEPTANZTEST:-agw-demo-akzeptanztest-change-before-network-use}
      FLOW_AGENT_GATEWAY_KEY_CODEPRUEFUNG: ${FLOW_AGENT_GATEWAY_KEY_CODEPRUEFUNG:-agw-demo-codepruefung-change-before-network-use}
      FLOW_AGENT_GATEWAY_KEY_DOKUMENTATION: ${FLOW_AGENT_GATEWAY_KEY_DOKUMENTATION:-agw-demo-dokumentation-change-before-network-use}
      FLOW_AGENT_GATEWAY_KEY_NACHWEISE: ${FLOW_AGENT_GATEWAY_KEY_NACHWEISE:-agw-demo-nachweise-change-before-network-use}
      FLOW_AGENT_GATEWAY_KEY_GESCHAEFTSFUEHRUNG: ${FLOW_AGENT_GATEWAY_KEY_GESCHAEFTSFUEHRUNG:-agw-demo-geschaeftsfuehrung-change-before-network-use}
      SESSION_KEY: ${AGENTGATEWAY_SESSION_KEY:-02183306b4f9f14e3b3ea4eef718f9ad3aebeda74b4f34275b3dfa7702475234}
      OIDC_COOKIE_SECRET: ${AGENTGATEWAY_OIDC_COOKIE_SECRET:-c69b97a25b12a2dbd96bb161dd582365e3ceb597b83dd0cc902b4dda3f88ec64}
      ISSUER_URL: ${OIDC_EXTERNAL_ISSUER:-http://localhost:8082/realms/open-manufacturing}
      OIDC_AUTHORIZATION_ENDPOINT: ${OIDC_EXTERNAL_ISSUER:-http://localhost:8082/realms/open-manufacturing}/protocol/openid-connect/auth
      OIDC_TOKEN_ENDPOINT: http://keycloak:8080/realms/open-manufacturing/protocol/openid-connect/token
      OIDC_JWKS_URL: http://keycloak:8080/realms/open-manufacturing/protocol/openid-connect/certs
      UI_CLIENT_ID: agentgateway-ui
      UI_CLIENT_SECRET: ${AGENTGATEWAY_OIDC_CLIENT_SECRET:-agentgateway-oidc-demo-change-me}
      REDIRECT_URI: ${AGENTGATEWAY_UI_PUBLIC_URL:-http://localhost:4001}/oauth/callback
    ports:
      # Nur Loopback: der FLOWAGENTS-Orchestrator läuft als Host-Dienst.
      - "127.0.0.1:${AGENTGATEWAY_LLM_PORT:-4000}:4000"
    volumes:
      - ./deployment/agentgateway/config.yaml:/config/config.yaml:ro
      - agentgateway-data:/data
    depends_on:
      keycloak:
        condition: service_started
    networks: [platform]

  agentgateway-shell:
    image: nginx:1.29.5-alpine
    profiles: [full, webui, ai-gateway]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AGENTGATEWAY_UI_PORT:-4001}:8080"
    volumes:
      - ./deployment/app-shell/agentgateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./services/platform_api/app/static/company-shell.js:/opt/company-shell/company-shell.js:ro
      - ./services/platform_api/app/static/company-theme.css:/opt/company-shell/company-theme.css:ro
      - ./services/platform_api/app/static/app-launcher.js:/opt/company-shell/app-launcher.js:ro
      - ./services/platform_api/app/static/app-launcher.css:/opt/company-shell/app-launcher.css:ro
    depends_on:
      agentgateway:
        condition: service_started
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/_company/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [platform]

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.4
    profiles: [full, webui]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WEBUI_URL: http://localhost:${OPEN_WEBUI_PORT:-3001}
      WEBUI_NAME: ERP Eigenbau - Lokale KI
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY:-local-open-webui-demo-secret-change-before-network-use}
      WEBUI_AUTH_TRUSTED_EMAIL_HEADER: X-Flow-Sso-Email
      WEBUI_AUTH_TRUSTED_NAME_HEADER: X-Flow-Sso-Name
      WEBUI_AUTH_TRUSTED_ROLE_HEADER: X-Flow-Sso-App-Role
      ENABLE_LOGIN_FORM: "false"
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: http://agentgateway:4000/v1
      OPENAI_API_KEY: ${AGENTGATEWAY_OPENWEBUI_KEY:-agw-demo-openwebui-change-before-network-use}
      ENABLE_TOOL_SERVERS: "true"
      MCP_INITIALIZE_TIMEOUT: 30
      TOOL_SERVER_CONNECTIONS: >-
        [
          {"url":"http://platform-mcp:8090/mcp","path":"openapi.json","type":"mcp","auth_type":"none","forward_cookies":false,"headers":null,"key":"","config":{"enable":true,"function_name_filter_list":"","access_grants":[]},"info":{"id":"erp","name":"Persönlicher Arbeitsplatz & ERP","description":"Rollenabhängiges Tagesbriefing sowie freigegebene ERP-, Fertigungs-, Bestands- und Testdatenwerkzeuge. Belegreferenzen nennen; Schreibwerkzeuge nur nach Vorschau und ausdrücklicher Bestätigung verwenden."}},
          {"url":"http://dms-mcp:8091/mcp","path":"openapi.json","type":"mcp","auth_type":"none","forward_cookies":false,"headers":null,"key":"","config":{"enable":true,"function_name_filter_list":"","access_grants":[]},"info":{"id":"dms","name":"DMS-Dokumente & Vektorsuche","description":"Freigegebene Paperless-Metadaten, OCR-Treffer und semantische pgvector-Suche. Antworten mit den gelieferten Dokument-URLs verlinken."}},
          {"url":"http://knowledge-mcp:8092/mcp","path":"openapi.json","type":"mcp","auth_type":"none","forward_cookies":false,"headers":null,"key":"","config":{"enable":true,"function_name_filter_list":"","access_grants":[]},"info":{"id":"wiki","name":"Unternehmenswissen","description":"Prozess-, Benutzer-, Admin- und Schnittstellendokumentation. Antworten ausschließlich aus Treffern zusammenfassen und jede verwendete Wiki-Seite verlinken."}},
          {"url":"http://dev-mcp:8093/mcp","path":"openapi.json","type":"mcp","auth_type":"none","forward_cookies":false,"headers":null,"key":"","config":{"enable":true,"function_name_filter_list":"","access_grants":[]},"info":{"id":"dev","name":"Entwicklung & Repository","description":"Code, Doku, Agentenregister und Anforderungen von ERP_Eigenbau nur lesen (Pfad und Zeilen zitieren), Status der Agentenläufe abfragen. Änderungen nie selbst durchführen, sondern mit propose_fachauftrag als Vorschlag anlegen und dem Nutzer den Bestätigungslink nennen."}}
        ]
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      agentgateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [platform]

  open-webui-shell:
    image: nginx:1.29.5-alpine
    profiles: [full, webui]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-3001}:8080"
    volumes:
      - ./deployment/app-shell/open-webui.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/app-shell:/etc/nginx/company:ro
      - ./services/platform_api/app/static/company-shell.js:/opt/company-shell/company-shell.js:ro
      - ./services/platform_api/app/static/company-theme.css:/opt/company-shell/company-theme.css:ro
      - ./services/platform_api/app/static/app-launcher.js:/opt/company-shell/app-launcher.js:ro
      - ./services/platform_api/app/static/app-launcher.css:/opt/company-shell/app-launcher.css:ro
    depends_on:
      open-webui:
        condition: service_healthy
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/_company/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [platform]

  prometheus:
    image: prom/prometheus:v3.7.1
    profiles: [ops]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [platform]

  prometheus-shell:
    image: nginx:1.29.5-alpine
    profiles: [ops]
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:8080"
    volumes:
      - ./deployment/app-shell/prometheus.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/app-shell:/etc/nginx/company:ro
      - ./services/platform_api/app/static/company-shell.js:/opt/company-shell/company-shell.js:ro
      - ./services/platform_api/app/static/company-theme.css:/opt/company-shell/company-theme.css:ro
      - ./services/platform_api/app/static/app-launcher.js:/opt/company-shell/app-launcher.js:ro
      - ./services/platform_api/app/static/app-launcher.css:/opt/company-shell/app-launcher.css:ro
    depends_on:
      prometheus:
        condition: service_started
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/_company/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [platform]

  grafana:
    image: grafana/grafana:12.2.0
    profiles: [ops]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-demo-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: light
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000}
      GRAFANA_PAPERLESS_DB_PASSWORD: ${GRAFANA_PAPERLESS_DB_PASSWORD:-grafana-paperless-demo-change-me}
      GRAFANA_MANAGEMENT_DB_PASSWORD: ${GRAFANA_MANAGEMENT_DB_PASSWORD:-grafana-management-demo-change-me}
      REPORTING_API_TOKEN: ${REPORTING_API_TOKEN:-local-reporting-token-change-before-network-use}
      GF_PLUGINS_PREINSTALL_SYNC: "yesoreyeram-infinity-datasource@3.7.4"
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${GRAFANA_OIDC_ENABLED:-false}
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: ${GRAFANA_OIDC_AUTO_LOGIN:-true}
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${OIDC_EXTERNAL_ISSUER:-http://localhost:8082/realms/open-manufacturing}/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/realms/open-manufacturing/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/realms/open-manufacturing/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'platform-admin') && 'GrafanaAdmin' || contains(roles[*], 'grafana-viewer') && 'Viewer' || 'None'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: ${GRAFANA_DISABLE_LOGIN_FORM:-false}
      GF_AUTH_SIGNOUT_REDIRECT_URL: "${OIDC_EXTERNAL_ISSUER:-http://localhost:8082/realms/open-manufacturing}/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=${GRAFANA_PUBLIC_URL:-http://localhost:3000}/"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deployment/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
      management-reporting-seed:
        condition: service_completed_successfully
    networks: [platform]

  grafana-shell:
    image: nginx:1.29.5-alpine
    profiles: [ops]
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:8080"
    volumes:
      - ./deployment/app-shell/grafana.conf:/etc/nginx/conf.d/default.conf:ro
      - ./services/platform_api/app/static/company-shell.js:/opt/company-shell/company-shell.js:ro
      - ./services/platform_api/app/static/company-theme.css:/opt/company-shell/company-theme.css:ro
      - ./services/platform_api/app/static/app-launcher.js:/opt/company-shell/app-launcher.js:ro
      - ./services/platform_api/app/static/app-launcher.css:/opt/company-shell/app-launcher.css:ro
    depends_on:
      grafana:
        condition: service_started
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [platform]

networks:
  platform:
    driver: bridge

volumes:
  demo-db-data:
  demo-state:
  paperless-redis:
  paperless-db-data:
  paperless-data:
  paperless-media:
  paperless-export:
  paperless-consume:
  paperless-seed-state:
  flowdoc-files:
  erpnext-db-data-v16:
  erpnext-redis-queue:
  erpnext-sites-v16:
  erpnext-logs-v16:
  ollama-data:
  agentgateway-data:
  open-webui-data:
  prometheus-data:
  grafana-data:
  keycloak-data:
  redmine-db-data:
  redmine-files:
