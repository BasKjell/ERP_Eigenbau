site_name: Open Manufacturing Platform
site_description: Prozess-, User- und Admin-Dokumentation der ERP-Eigenbau-Demo
site_url: http://localhost:8001
repo_name: ERP_Eigenbau
docs_dir: docs

theme:
  name: material
  language: de
  palette:
    - scheme: default
      primary: teal
      accent: light green
      toggle:
        icon: material/weather-night
        name: Dunkles Design
    - scheme: slate
      primary: teal
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Helles Design
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search:
      lang: de

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/extra.css

