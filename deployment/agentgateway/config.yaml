# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# FLOWGATE is the central, OpenAI-compatible model gateway.  The configuration
# stays in Git; secrets are expanded from the container environment at runtime.
gateways:
  ui-gateway:
    port: 4001

llm:
  port: 4000
  policies:
    apiKey:
      mode: strict
      keys:
      - key: ${AGENTGATEWAY_OPENWEBUI_KEY}
        metadata:
          consumer: open-webui
          purpose: employee-chat
        allowedModels:
        - qwen3:8b
        - qwen3-coder:30b
      # FLOWAGENTS (agents/registry.yaml): ein Schlüssel je Rolle, nur das Modellprofil der Rolle.
      - key: ${FLOW_AGENT_GATEWAY_KEY_ANFORDERUNGEN}
        metadata:
          consumer: agent-anforderungen
          purpose: flow-agents
        allowedModels:
        - flow-builder
      - key: ${FLOW_AGENT_GATEWAY_KEY_ARCHITEKTUR}
        metadata:
          consumer: agent-architektur
          purpose: flow-agents
        allowedModels:
        - flow-builder
      - key: ${FLOW_AGENT_GATEWAY_KEY_ENTWICKLUNG}
        metadata:
          consumer: agent-entwicklung
          purpose: flow-agents
        allowedModels:
        - flow-coder
      - key: ${FLOW_AGENT_GATEWAY_KEY_ANFORDERUNGSPRUEFUNG}
        metadata:
          consumer: agent-anforderungspruefung
          purpose: flow-agents
        allowedModels:
        - flow-reviewer
      - key: ${FLOW_AGENT_GATEWAY_KEY_SICHERHEIT}
        metadata:
          consumer: agent-sicherheit
          purpose: flow-agents
        allowedModels:
        - flow-reviewer
      - key: ${FLOW_AGENT_GATEWAY_KEY_AKZEPTANZTEST}
        metadata:
          consumer: agent-akzeptanztest
          purpose: flow-agents
        allowedModels:
        - flow-reviewer
      - key: ${FLOW_AGENT_GATEWAY_KEY_CODEPRUEFUNG}
        metadata:
          consumer: agent-codepruefung
          purpose: flow-agents
        allowedModels:
        - flow-reviewer
      - key: ${FLOW_AGENT_GATEWAY_KEY_GESCHAEFTSFUEHRUNG}
        metadata:
          consumer: agent-geschaeftsfuehrung
          purpose: flow-agents
        allowedModels:
        - flow-reviewer
      - key: ${FLOW_AGENT_GATEWAY_KEY_PLANUNG}
        metadata:
          consumer: agent-planung
          purpose: flow-agents
        allowedModels:
        - flow-assist
      - key: ${FLOW_AGENT_GATEWAY_KEY_DOKUMENTATION}
        metadata:
          consumer: agent-dokumentation
          purpose: flow-agents
        allowedModels:
        - flow-assist
      - key: ${FLOW_AGENT_GATEWAY_KEY_NACHWEISE}
        metadata:
          consumer: agent-nachweise
          purpose: flow-agents
        allowedModels:
        - flow-assist
  models:
  - name: qwen3:8b
    provider: ollama
    params:
      model: qwen3:8b
      baseUrl: ${AGENTGATEWAY_OLLAMA_BASE_URL}
  - name: qwen3-coder:30b
    provider: ollama
    params:
      model: qwen3-coder:30b
      baseUrl: ${AGENTGATEWAY_OLLAMA_BASE_URL}
  # Modellprofile der Agentenrollen. Die Zuordnung ist an die Evaluation gebunden (Teil 09/10);
  # ein Wechsel ist ein Change mit erneuter Bewertung der Referenzfälle (Test 34).
  - name: flow-builder
    provider: ollama
    params:
      model: qwen3:8b
      baseUrl: ${AGENTGATEWAY_OLLAMA_BASE_URL}
  - name: flow-assist
    provider: ollama
    params:
      model: qwen3:8b
      baseUrl: ${AGENTGATEWAY_OLLAMA_BASE_URL}
  - name: flow-coder
    provider: ollama
    params:
      model: qwen3-coder:30b
      baseUrl: ${AGENTGATEWAY_OLLAMA_BASE_URL}
  - name: flow-reviewer
    provider: ollama
    params:
      model: gemma3:12b
      baseUrl: ${AGENTGATEWAY_OLLAMA_BASE_URL}

ui:
  gateways: [ui-gateway]
  policies:
    oidc:
      # The token issuer remains the browser-visible Keycloak URL.  Explicit
      # internal token/JWKS endpoints let the container reach the same realm.
      issuer: ${ISSUER_URL}
      authorizationEndpoint: ${OIDC_AUTHORIZATION_ENDPOINT}
      tokenEndpoint: ${OIDC_TOKEN_ENDPOINT}
      tokenEndpointAuth: clientSecretBasic
      jwks:
        url: ${OIDC_JWKS_URL}
      clientId: ${UI_CLIENT_ID}
      clientSecret: ${UI_CLIENT_SECRET}
      redirectURI: ${REDIRECT_URI}
      credentials: session
      scopes:
      - profile
      - email
    authorization:
      rules:
      - allow: 'jwt.roles.exists(role, role == "platform-admin")'

frontendPolicies:
  accessLog:
    add:
      user.id: jwt.sub
      user.email: jwt.email
      user.department: jwt.department
