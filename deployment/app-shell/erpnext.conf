map $http_upgrade $company_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    charset utf-8;
    absolute_redirect off;
    client_max_body_size 50m;
    set $flow_sso_app erpnext;
    include /etc/nginx/company/sso-server.inc;
    set $flow_erpnext_upstream erpnext-frontend:8080;

    location = /_company/app-launcher.js {
        alias /opt/company-shell/app-launcher.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    location = /_company/app-launcher.css {
        alias /opt/company-shell/app-launcher.css;
        default_type text/css;
        add_header Cache-Control "no-cache";
    }

    location = /_company/company-shell.js {
        alias /opt/company-shell/company-shell.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    location = /_company/company-theme.css {
        alias /opt/company-shell/company-theme.css;
        default_type text/css;
        add_header Cache-Control "no-cache";
    }

    location = /_company/auth/me {
        proxy_pass http://$flow_platform_upstream/auth/me;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Skip Frappe's technical app selector for normal FLOWERP users. The
    # Framework workspace remains available to administrators at /desk/build.
    location = / {
        return 302 /desk/setup/home;
    }

    # The stock ERPNext frontend normalizes the Socket.IO Origin to its
    # internal site name (`frontend`). Forward the matching Host only for the
    # realtime endpoint so Frappe's same-origin check remains enabled.
    location ^~ /socket.io {
        proxy_pass http://$flow_erpnext_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host frontend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $company_connection_upgrade;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://$flow_erpnext_upstream;
        # The stock Frappe frontend forwards `Host` as `$host` and therefore
        # drops the public demo port. Rewrite only its port-less localhost
        # redirects back to the URL the browser actually used. Redirects to
        # Keycloak on :8082 remain untouched.
        proxy_redirect http://localhost/ $scheme://$http_host/;
        include /etc/nginx/company/sso-proxy-headers.inc;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $company_connection_upgrade;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 120s;
        sub_filter_once on;
        sub_filter '</head>' '<meta name="company-shell-app" content="erp"><link rel="stylesheet" href="/_company/app-launcher.css"><link rel="stylesheet" href="/_company/company-theme.css"><script src="/_company/company-shell.js" defer></script><script src="/_company/app-launcher.js" defer></script></head>';
    }
}
