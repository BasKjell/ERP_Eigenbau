map $http_upgrade $company_connection_upgrade { default upgrade; '' close; }
server {
    listen 8080;
    server_name _;
    charset utf-8;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $flow_platform_upstream platform-api:8080;

    location = /_company/app-launcher.js { alias /opt/company-shell/app-launcher.js; default_type application/javascript; add_header Cache-Control "no-cache"; }
    location = /_company/app-launcher.css { alias /opt/company-shell/app-launcher.css; default_type text/css; add_header Cache-Control "no-cache"; }
    location = /_company/company-shell.js { alias /opt/company-shell/company-shell.js; default_type application/javascript; add_header Cache-Control "no-cache"; }
    location = /_company/company-theme.css { alias /opt/company-shell/company-theme.css; default_type text/css; add_header Cache-Control "no-cache"; }
    location = /_company/auth/me { proxy_pass http://$flow_platform_upstream/auth/me; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }

    location / {
        set $grafana_upstream grafana:3000;
        proxy_pass http://$grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $company_connection_upgrade;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 300s;
        sub_filter_once on;
        sub_filter '</head>' '<meta name="company-shell-app" content="grafana"><link rel="stylesheet" href="/_company/app-launcher.css"><link rel="stylesheet" href="/_company/company-theme.css"><script src="/_company/company-shell.js" defer></script><script src="/_company/app-launcher.js" defer></script></head>';
    }
}
