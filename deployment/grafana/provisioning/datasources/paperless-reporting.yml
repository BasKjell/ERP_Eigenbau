apiVersion: 1

datasources:
  - name: Paperless Dokumentenplanung
    uid: paperless-reporting
    type: postgres
    access: proxy
    url: paperless-db:5432
    user: grafana_reader
    secureJsonData:
      password: ${GRAFANA_PAPERLESS_DB_PASSWORD}
    jsonData:
      database: paperless
      sslmode: disable
      postgresVersion: 1800
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    editable: false
