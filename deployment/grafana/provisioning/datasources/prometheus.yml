apiVersion: 1

# Feste UID „prometheus“, damit provisionierte Dashboards die Quelle eindeutig ansprechen.
# Der Löscheintrag ersetzt eine ältere, ohne UID angelegte Quelle gleichen Namens.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
