apiVersion: 1

datasources:
  - name: Management Reporting
    uid: management-reporting
    type: postgres
    access: proxy
    url: demo-db:5432
    user: grafana_management_reader
    secureJsonData:
      password: ${GRAFANA_MANAGEMENT_DB_PASSWORD}
    jsonData:
      database: platform_demo
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    editable: false
