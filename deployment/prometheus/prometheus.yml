global:
  scrape_interval: 15s

scrape_configs:
  - job_name: platform-api
    metrics_path: /metrics
    static_configs:
      - targets: ["platform-api:8080"]
  # FLOWGATE (agentgateway): alle lokalen LLM-Token, auch FLOWAI-Chats in Open WebUI.
  - job_name: agentgateway
    metrics_path: /metrics
    static_configs:
      - targets: ["agentgateway:15020"]
