      - services/platform_api/app/static/mes.css
  mes-backend:
    label: FLOWMES Fertigung – Backend
    paths:
      - services/platform_api/app/mes.py
      - services/platform_api/tests/test_store_mes_unit.py
  hr-ui:
    label: FLOWHR Personal – Oberfläche (Skript, Stil)
