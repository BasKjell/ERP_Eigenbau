# FLOWAGENTS – Betriebskonfiguration für den lokalen Pilot (Host-Dienst, siehe docs/agents/betrieb.md).
# Geheimnisse stehen nie hier: rm_secret_env/api_secret_env nennen nur Umgebungsvariablen.
# demo_mode: true erlaubt die dokumentierten Demo-Geheimnisse und Entscheidungen durch
# platform-admin im lokalen Demo-Modus. Vor jeder Netzwerknutzung auf false setzen.

agents_directory: agents
state_directory: ~/.flow-agents
listen: 127.0.0.1:8095
platform_url: http://127.0.0.1:8088
rm_secret_env: FLOW_AGENT_RM_SECRET
api_secret_env: FLOW_AGENTS_API_SECRET
demo_mode: true
poll_seconds: 3

# Modellprofil -> Provider. gateway = lokale Modelle über FLOWGATE; simulated = regelbasiert
# ohne Modell (Tests, Vorführung); codex/claude = isolierte Abo-CLIs (technisch gesperrt).
providers:
  builder: gateway
  coder: gateway
  pruefer: gateway
  assistenz: gateway
  leitung: gateway

gateway:
  url: http://127.0.0.1:4000
  keys_env_prefix: FLOW_AGENT_GATEWAY_KEY_
  timeout_seconds: 900
  no_think: true

sandbox:
  enabled: true
  repository: .
  base_ref: HEAD
  check: docker
  image: flow-agents-sandbox:1
  timeout: 900
  allowed_prefixes:
    - services/platform_api/app/
    - services/platform_api/tests/
    - docs/
  command: >-
    cd services/platform_api &&
    export PYTHONPATH=$PWD DEMO_DATA_FILE=/tmp/scenario.json DEMO_SEED_FILE=$PWD/seed/scenario.json
    DOCUMENT_DIR=/tmp/w/output/pdf AGENT_REGISTRY_DIR=/tmp/w/agents MCP_AUDIT_FILE=/tmp/mcp-audit.jsonl &&
    ruff check app tests &&
    python -m pytest -q -p no:cacheprovider tests --ignore=tests/integration

# Freigegebene Änderungsbereiche. Ein Fachauftrag wählt genau einen Bereich; der
# Entwicklungs-Agent darf nur diese Dateien ändern. Erweiterung ist Klasse K.
scopes:
  dms-ui:
    label: DMS-Oberfläche FLOWDOC
    paths:
      - services/platform_api/app/static/dms.js
      - services/platform_api/app/static/dms.css
  dms-doku:
    label: DMS-Benutzerhilfe
    paths:
      - docs/user-guides/dms.md
  portal-hilfe:
    label: Portal- und Agentenhilfe
    paths:
      - docs/user-guides/company-portal.md
      - docs/agents/index.md

# Abo-CLIs (aus Trading_Ai übernommen). Gesperrt, bis Isolation unabhängig geprüft und durch
# Bas freigegeben ist (AGENTS.md §5). Image nur per Digest.
container:
  execution_enabled: false
  image: ""
  memory: 4g
  cpus: 2
  pids: 128
  scratch: 1g
  timeout_seconds: 1800
  output_bytes: 2000000
  cooldown_seconds: 18000
  codex:
    model: gpt-6.2-sol
    effort: medium
    proxy: http://egress-codex:3128
    network: flow-dev-codex
    auth_volume: flow-dev-codex-auth
  claude:
    model: claude-opus-5-5
    effort: medium
    proxy: http://egress-claude:3128
    network: flow-dev-claude
    auth_volume: flow-dev-claude-auth
