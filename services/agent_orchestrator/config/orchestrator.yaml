      - services/platform_api/app/erpnext_client.py
      - services/platform_api/app/business_tools.py
      - services/platform_api/tests/test_integrations_unit.py
  # Agenten- und FLOWDOC-Doku im Wiki (MkDocs-Navigation besteht bereits). Sicherheitskonzept und
  # Nachweise bleiben bewusst außerhalb: die ändern Menschen.
  agenten-doku:
    label: Wiki – Agenten und FLOWDOC (Funktionsweise, Bedienung, Betrieb)
    paths:
      - docs/agents/index.md
      - docs/agents/bedienung.md
      - docs/agents/betrieb.md
      - docs/agents/modellbewertung.md
      - docs/user-guides/flowdoc.md
  # Geschäftsprozesse im Wiki (Diagramme als Mermaid, Zuständigkeiten je Rolle). Die Referenzen
  # liefern Fachwissen aus ERP, Lager und Qualität und werden nur gelesen.
  prozess-einkauf-lager-qm:
    label: Wiki – Prozesse Einkauf, Wareneingang, Lager, Qualität
    paths:
      - docs/processes/order-to-cash/goods-receipt.md
      - docs/processes/order-to-cash/procurement.md
      - docs/processes/order-to-cash/quality.md
      - docs/processes/order-to-cash/responsibilities.md
    reads:
      - docs/processes/order-to-cash/overview.md
      - docs/processes/order-to-cash/projects-warehouses.md
      - docs/tools/user/erpnext.md
      - docs/user-guides/quality.md
      - docs/tools/user/paperless.md
  # Zentrale HTTP-Routen der Plattform-API. Zu groß für lokale Modelle; nur mit Codex/Claude.
  plattform-routen:
    label: Plattform-API – zentrale Routen (main.py, flow_routes.py) – komplex, Codex/Claude
    complexity: hoch
    paths:
      - services/platform_api/app/main.py
      - services/platform_api/app/flow_routes.py
  doku-anwender:
    label: Anwenderhilfe FLOWQ, MES, HR, FIN, FLOWSPACE, FLOWWORK
    paths:
      - docs/user-guides/quality.md
      - docs/user-guides/mes.md
      - docs/user-guides/hr.md
      - docs/user-guides/finance.md
      - docs/user-guides/desksharing.md
      - docs/user-guides/flowwork.md
  # Demo-Projekte aus agents/projects.json (Testprodukt und Prüfstand). Beide Projekte dürfen nur ihre
  # eigenen Projektunterlagen ändern; Gerätesoftware und Prüfsoftware liegen nicht in diesem Repository.
  tm100-doku:
    label: Testprodukt TM-100 – Projektunterlagen (Lastenheft, Architektur, Tests)
    paths:
      - docs/demo/projekte/tm-100/lastenheft.md
      - docs/demo/projekte/tm-100/architektur.md
      - docs/demo/projekte/tm-100/verifikation.md
  ps-tm100-doku:
    label: Prüfstand TM-100 – Prüfspezifikation und Validierung
    paths:
      - docs/demo/projekte/ps-tm100/pruefspezifikation.md
      - docs/demo/projekte/ps-tm100/validierung.md
# Laufbudget je Änderungsklasse (überschreibt agents/workflow.yaml). Der Tech Lead kann bei
# „Laufbudget erschöpft“ bewusst je 20 weitere Modellaufrufe freigeben.
budgets:
  standard: {max_model_calls: 60, max_output_tokens: 200000}
  neue_funktion: {max_model_calls: 80, max_output_tokens: 300000}
  kritisch: {max_model_calls: 100, max_output_tokens: 400000}

# Nach der Fachabnahme (G4) wird genau der abgenommene Stand als lokaler Branch agent/<Auftrag>-…
# übernommen. push: true veröffentlicht den Branch zusätzlich; Merge bleibt beim Menschen.
adoption:
  enabled: true
  push: false
  remote: origin

# Vorschau des Kandidaten für die Fachabnahme (G4): zweite Plattform-API im Demo-Modus auf
# 127.0.0.1:8098, Code read-only aus der Sandbox, Paperless mit dem technischen Demo-Konto.
preview:
  enabled: true
  image: erp-eigenbau-platform-api:latest
  port: 8098
  network: erp-eigenbau_platform
  env:
    PAPERLESS_BASE_URL: http://paperless-webserver:8000
    PAPERLESS_PUBLIC_URL: http://localhost:8010
    PAPERLESS_USERNAME: admin
    PAPERLESS_PASSWORD: admin-demo-change-me
    DEMO_DATA_FILE: /data/scenario.json
    AGENT_REGISTRY_DIR: /app/agents

# Abo-CLIs (aus Trading_Ai übernommen). Gesperrt, bis Isolation unabhängig geprüft und durch
# Bas freigegeben ist (AGENTS.md §5). Image nur per Digest.
container:
  # Freigegeben am 2026-11-22 durch Bas: Umgebung aus Trading_Ai (Worker-Image, interne Netze,
  # Egress-Proxys nur zum jeweiligen Anbieter, Abo-Anmeldung in schreibgeschützten Volumes).
  execution_enabled: true
  image: trading-orchestrator-worker@sha256:938cc09ff3c15a64fffa7b2f72607f149714166d2c8eb5141d7c011f3f9e5a6d
  worker_script: /opt/dev_orchestrator_worker.py
  memory: 4g
  cpus: 2
  pids: 128
  scratch: 1g
  timeout_seconds: 1800
  output_bytes: 2000000
  cooldown_seconds: 18000
  codex:
    model: gpt-6.2-sol
    effort: medium
    proxy: http://egress-codex:3128
    network: trading-dev-codex
    auth_volume: trading-dev-codex-auth
  claude:
    model: claude-opus-5-5
    effort: medium
    proxy: http://egress-claude:3128
    network: trading-dev-claude
    auth_volume: trading-dev-claude-auth

# Komplexe Aufträge: Entwicklung durch Codex, Code-Review durch Claude (verschiedene Familien,
# auch gegenüber qwen/gemma). Komplex = Klasse kritisch, Änderungsbereich „complexity: hoch“,
# Umsetzung „abo“ im Auftrag oder zwei gescheiterte lokale Versuche desselben Schritts.
# Vertrauliche Aufträge und Umsetzung „lokal“ bleiben immer auf den lokalen Modellen.
escalation:
  enabled: true
  roles:
    entwicklung: codex
    codepruefung: claude
  complex_classes: [kritisch]
  after_local_failures: 2
  fallback_local: true
  max_scope_chars: 200000

# Klickprüfung an G4: Klickpfade der Akzeptanztests laufen in einem headless Chromium
# (Image aus deployment/ui-runner) gegen die Vorschau, im internen Netz flow-agents-ui ohne Internet.
ui_check:
  enabled: true
  image: flow-agents-ui-runner:1
  timeout_seconds: 240
  # Die Vorschau nutzt noch das echte Paperless (technisches Konto). Bis es eine eigene
  # Demo-Instanz gibt, blockiert der Prüfbrowser alle schreibenden Anfragen (POST/PUT/PATCH/DELETE).
  allow_writes: false

