      - services/platform_api/app/erpnext_client.py
      - services/platform_api/app/business_tools.py
      - services/platform_api/tests/test_integrations_unit.py
  doku-anwender:
    label: Anwenderhilfe FLOWQ, MES, HR, FIN, FLOWSPACE, FLOWWORK
    paths:
      - docs/user-guides/quality.md
      - docs/user-guides/mes.md
      - docs/user-guides/hr.md
      - docs/user-guides/finance.md
      - docs/user-guides/desksharing.md
