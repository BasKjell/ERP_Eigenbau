      - services/platform_api/app/static/hr.css
  hr-seite:
    label: FLOWHR Personal – Seitenaufbau (HTML)
    paths:
      - services/platform_api/app/static/hr.html
  hr-backend:
    label: FLOWHR Personal – Backend
    paths:
      - services/platform_api/app/hr.py
      - services/platform_api/tests/test_hr.py
  finance-ui:
    label: FLOWFIN Finanzen – Oberfläche
    paths:
      - services/platform_api/app/static/finance.js
      - services/platform_api/app/static/finance.html
      - services/platform_api/app/static/finance-cash.css
  finance-backend:
    label: FLOWFIN Finanzen – Backend
    paths:
      - services/platform_api/app/finance.py
      - services/platform_api/tests/test_finance.py
  desksharing-ui:
    label: FLOWSPACE Desksharing – Oberfläche
    paths:
      - services/platform_api/app/static/desksharing.js
      - services/platform_api/app/static/desksharing.html
      - services/platform_api/app/static/desksharing.css
  desksharing-backend:
    label: FLOWSPACE Desksharing – Backend
    paths:
      - services/platform_api/app/desksharing.py
      - services/platform_api/tests/test_desksharing.py
