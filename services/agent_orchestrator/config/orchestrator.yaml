# Laufbudget je Änderungsklasse (überschreibt agents/workflow.yaml). Der Tech Lead kann bei
# „Laufbudget erschöpft“ bewusst je 20 weitere Modellaufrufe freigeben.
budgets:
  standard: {max_model_calls: 60, max_output_tokens: 200000}
  neue_funktion: {max_model_calls: 80, max_output_tokens: 300000}
  kritisch: {max_model_calls: 100, max_output_tokens: 400000}

# Nach der Fachabnahme (G4) wird genau der abgenommene Stand als lokaler Branch agent/<Auftrag>-…
# übernommen. push: true veröffentlicht den Branch zusätzlich; Merge bleibt beim Menschen.
adoption:
  enabled: true
  push: false
  remote: origin

# Vorschau des Kandidaten für die Fachabnahme (G4): zweite Plattform-API im Demo-Modus auf
# 127.0.0.1:8098, Code read-only aus der Sandbox, Paperless mit dem technischen Demo-Konto.
preview:
  enabled: true
  image: erp-eigenbau-platform-api:latest
  port: 8098
  network: erp-eigenbau_platform
  env:
    PAPERLESS_BASE_URL: http://paperless-webserver:8000
    PAPERLESS_PUBLIC_URL: http://localhost:8010
    PAPERLESS_USERNAME: admin
    PAPERLESS_PASSWORD: admin-demo-change-me
    DEMO_DATA_FILE: /data/scenario.json
    AGENT_REGISTRY_DIR: /app/agents

# Abo-CLIs (aus Trading_Ai übernommen). Gesperrt, bis Isolation unabhängig geprüft und durch
# Bas freigegeben ist (AGENTS.md §5). Image nur per Digest.
container:
  execution_enabled: false
  image: ""
  memory: 4g
  cpus: 2
  pids: 128
  scratch: 1g
  timeout_seconds: 1800
  output_bytes: 2000000
  cooldown_seconds: 18000
  codex:
    model: gpt-6.2-sol
    effort: medium
    proxy: http://egress-codex:3128
    network: flow-dev-codex
    auth_volume: flow-dev-codex-auth
  claude:
    model: claude-opus-5-5
    effort: medium
    proxy: http://egress-claude:3128
    network: flow-dev-claude
    auth_volume: flow-dev-claude-auth
