  - id: REQ-PRT-004
    title: Keine erfundene Aktivität
    type: Software
    priority: Muss
    status: review
    source: AGENTS.md §4 Kennzeichnung
    text: Meldet sich der Orchestrator nicht, zeigt das Portal nur das Register mit dem Hinweis „nicht verbunden“ und nimmt keine Aufträge an.
