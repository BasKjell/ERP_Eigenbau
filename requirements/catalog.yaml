  # --- Requirements in FLOWWORK -------------------------------------------------------------------
  - id: REQ-REQ-001
    title: Agenten-Entwürfe landen versioniert in FLOWWORK
    type: Interface
    priority: Muss
    status: review
    source: KI-EK Teil 08 „Vertrag des MCP Adapters“; AUF-BAS-2026-11-22 „Requirements im Jama-Nachbau“
    text: Der Anforderungs-Agent legt Entwürfe über rm.create_draft mit Idempotenzschlüssel an. Gleicher Schlüssel und gleiche Nutzlast liefern dasselbe Objekt; abweichende Nutzlast erzeugt einen Konflikt.
    acceptance_criteria:
      - Ein Entwurf erscheint im FLOWWORK-Dashboard mit Projekt, Lauf und Status draft.
      - Wiederholung nach Zeitüberschreitung erzeugt genau einen Entwurf.
    verification:
      - services/platform_api/tests/test_flow_agents.py::test_requirements_agent_creates_versioned_draft_in_flowwork
      - services/platform_api/tests/test_flow_agents.py::test_26_create_draft_is_idempotent_and_detects_conflicting_payloads

  - id: REQ-REQ-002
    title: Änderungen nur gegen die erwartete Version
    type: Interface
    priority: Muss
    status: review
    source: KI-EK Test 27
    text: rm.update_draft verlangt expected_version; Kommentare binden ID und Version.
    acceptance_criteria:
      - Zwei Änderungen gegen dieselbe Version führen zu genau einer Aktualisierung und einem Versionskonflikt.
    verification:
      - services/platform_api/tests/test_flow_agents.py::test_27_concurrent_updates_against_same_version_conflict
      - services/platform_api/tests/test_flow_agents.py::test_comments_bind_to_current_version_only

  - id: REQ-REQ-003
    title: Agenten erteilen in FLOWWORK keine Freigaben
    type: System
    priority: Muss
    status: review
    source: KI-EK Test 09
    text: Über den RM-Adapter gibt es keine Freigabeoperation; Agenten-Tokens werden an den übrigen FLOWWORK-Endpunkten abgewiesen.
    acceptance_criteria:
      - Der Versuch, Status „approved“ über den Adapter oder die FLOWWORK-API zu setzen, ändert den Status nicht.
    verification:
      - services/platform_api/tests/test_flow_agents.py::test_09_agents_cannot_approve_requirements

  - id: REQ-REQ-004
    title: Arbeitsbaseline nur durch den Orchestrator
    type: System
    priority: Muss
    status: review
    source: KI-EK Teil 08 „Zwei Arten von Baseline“
    text: Nach erfüllter Prüfung friert ausschließlich der Orchestrator die Arbeitsbaseline ein; geänderte Anforderungsversionen werden abgelehnt. „Fachlich freigegeben“ entscheidet der Product Owner an G1.
    acceptance_criteria:
      - Eine Agentenrolle kann keine Baseline anlegen; eine veraltete Version erzeugt einen Konflikt.
    verification:
      - services/platform_api/tests/test_flow_agents.py::test_baseline_freeze_is_reserved_for_orchestrator_and_checks_versions
      - services/platform_api/tests/test_flow_agents.py::test_acceptance_tests_are_linked_within_the_same_project

  # --- DMS mit eigener Oberfläche ------------------------------------------------------------------
  - id: REQ-DOC-001
    title: Eigene DMS-Oberfläche über die Paperless-API
    type: Stakeholder
    priority: Muss
    status: review
    source: AUF-BAS-2026-11-22 „DMS mit komplett eigener Oberfläche“; ADR-007
    text: FLOWDOC bietet unter /dms eine eigene Oberfläche für Suchen, Filtern, Sortieren, Vorschau, Statuswechsel, Notizen und Ablage. Paperless-ngx bleibt führendes System für Ablage, Texterkennung und Rechte.
    acceptance_criteria:
      - /dms ist im Portal und im App-Launcher erreichbar; Paperless bleibt nur als Administrationszugang verlinkt.
    derives: [REQ-DOC-002]
    verification:
      - services/platform_api/tests/test_flow_agents.py::test_agents_page_and_dms_page_are_served

  - id: REQ-DOC-002
    title: Abfrage im Namen der angemeldeten Person
    type: System
    priority: Muss
    status: review
    source: KI-EK Teil 04, Test 18
    text: Im OIDC-Betrieb fragt FLOWDOC Paperless ausschließlich im Namen der angemeldeten Person ab. Weder Titel noch Trefferzahl oder Vorschau verraten Dokumente ohne Leserecht. Es gibt keinen Rückfall auf das technische Konto.
    acceptance_criteria:
      - Zwei Personen mit unterschiedlichen Rechten sehen nur ihre Dokumente und Trefferzahlen.
      - Ohne Anmeldung liefert FLOWDOC im OIDC-Modus 401.
    verification:
      - services/platform_api/tests/test_dms.py::test_18_search_runs_in_the_name_of_the_person
      - services/platform_api/tests/test_dms.py::test_oidc_mode_never_falls_back_to_the_technical_account

  - id: REQ-DOC-003
    title: Sortierung nach Titel und weiteren Feldern
    type: Software
    priority: Muss
    status: review
    source: KI-EK Teil 02 Beispiel A-17
    text: Die Ansicht sortiert sichtbare Dokumente auf Wunsch nach Titel auf- und absteigend, nach Datum, Dokumenttyp und Korrespondent. Rechte und Freigabestatus gelten unverändert.
    acceptance_criteria:
      - Bei den Titeln Beta und Alpha erscheint Alpha zuerst.
      - Eine unbekannte Sortierung wird abgelehnt.
    verification:
      - services/platform_api/tests/test_dms.py::test_a17_sort_by_title_and_status_filter

  - id: REQ-DOC-004
    title: Statusfilter und Statusworkflow
    type: Software
    priority: Muss
    status: review
    source: docs/user-guides/dms.md Statusmodell
    text: Dokumente lassen sich nach Entwurf, In Prüfung und Freigegeben filtern. Statuswechsel sind nur aus dem passenden Ausgangsstatus möglich; Paperless prüft das Änderungsrecht.
    acceptance_criteria:
      - „Zur Prüfung geben“ ist nur aus „Entwurf“ möglich; ein zweiter Versuch wird abgelehnt.
    verification:
      - services/platform_api/tests/test_dms.py::test_status_transition_respects_source_status_and_paperless_rights
      - services/platform_api/tests/test_dms.py::test_a17_sort_by_title_and_status_filter

  - id: REQ-DOC-005
    title: Vorschau, Download und Notizen
    type: Software
    priority: Soll
    status: review
    source: AUF-BAS-2026-11-22
    text: FLOWDOC zeigt Vorschau, Metadaten, erkannten Text und Notizen; nicht sichtbare Dokumente liefern 404.
    acceptance_criteria:
