    text: Ein Product Owner reicht im Portal einen Fachauftrag mit Zweck, Nutzergruppe, Verhalten, Erfolgsbeispiel, Klasse und Änderungsbereich ein und entscheidet in der Inbox.
    acceptance_criteria:
      - Eine Einreichung ohne Product-Owner-Rolle oder mit nicht freigegebenem Änderungsbereich wird abgelehnt.
